    const W = (seg, i) => V[seg].at + V[seg].words[i][1];
    const SYNC = W(0, 5);
    const BREATH = 1.2;
    const HERO = { x: -1018, y: -780, scale: 2.06 };

    const reflow = (dev, at) => tl.fromTo(dev + " .screens-rf", { opacity: 0, y: 14, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out", stagger: 0.04 }, at);
    const arrive = (dev, from, at) => {
      tl.fromTo(dev, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, at);
      tl.fromTo(dev, { x: 0, y: 0, scale: 1, ...from }, { x: 0, y: 0, scale: 1, duration: 0.9, ease: "expo.out", immediateRender: true }, at);
      tl.fromTo(dev, { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, at);
      tl.fromTo(dev + " .screens-lb", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, at + 0.55);
    };
    const roll = (dev, at) => {
      const o = { v: 150 };
      const els = [...document.querySelectorAll(dev + " .screens-amt .screens-n")];
      tl.fromTo(o, { v: 150 }, { v: 180, duration: 0.7, ease: "expo.out", immediateRender: false, onUpdate: () => els.forEach((e) => (e.textContent = Math.round(o.v))) }, at);
      tl.fromTo(dev + " .screens-amt", { color: "#f3f5f8" }, { color: "#ffb347", duration: 0.15, ease: "power2.out", immediateRender: false }, at + 0.1);
      tl.to(dev + " .screens-amt", { color: "#f3f5f8", duration: 0.6, ease: "power2.out" }, at + 0.5);
    };

    tl.fromTo(".screens-tw", { opacity: 0.2, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out", stagger: 0.09 }, 0);
    tl.fromTo("#screens-title", { y: 0, scale: 1 }, { y: -310, scale: 0.4, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 0.85);

    tl.set("#screens-world", HERO, 0);
    tl.fromTo("#screens-s8", { y: 420 }, { y: 0, duration: 1.0, ease: "expo.out" }, 1.0);
    reflow("#screens-s8", 1.3);
    roll("#screens-s8", 1.5);
    tl.fromTo("#screens-lb8", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.3);
    tl.fromTo("#screens-world", HERO, { x: 0, y: 0, scale: 1, duration: 1.25, ease: "expo.inOut", immediateRender: false }, 2.6);

    arrive("#screens-s15", { x: -560, scale: 0.94 }, 3.25);
    reflow("#screens-s15", 3.45);
    roll("#screens-s15", 3.6);

    arrive("#screens-tv", { x: 520, scale: 0.94 }, 4.1);
    tl.fromTo("#screens-art", { scale: 1, x: 0 }, { scale: 1.06, x: -30, duration: 0.75, ease: "none" }, 4.1);
    tl.fromTo("#screens-prog", { scaleX: 0.34 }, { scaleX: 0.36, duration: 0.75, ease: "none" }, 4.1);
    tl.fromTo("#screens-shade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 4.85);
    tl.fromTo("#screens-pause", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)", transformOrigin: "50% 50%", immediateRender: false }, 4.85);
    tl.to(["#screens-ntitle", "#screens-barw"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.85);
    tl.fromTo("#screens-pnote", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 5.0);
    tl.fromTo("#screens-corner", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, 5.1);

    arrive("#screens-dot", { x: 460, scale: 0.9 }, 4.95);
    tl.fromTo(["#screens-ring", "#screens-edge"], { opacity: 0 }, { opacity: 0.7, duration: 0.4, ease: "power2.out", immediateRender: false }, 5.2);
    tl.fromTo("#screens-pool", { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: "power2.out", immediateRender: false }, 5.2);
    tl.fromTo("#screens-pill", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 5.0);
    tl.fromTo("#screens-pill", { y: 70 }, { y: 0, duration: 0.7, ease: "expo.out" }, 5.0);

    arrive("#screens-ph", { x: -520, scale: 0.96 }, 5.85);
    reflow("#screens-ph", 6.1);
    roll("#screens-ph", 6.2);

    V.forEach((seg, k) => {
      const el = document.querySelector(seg.el);
      el.innerHTML = seg.words.map((w) => `<span>${w[0]}</span>`).join(" ");
      const spans = [...el.querySelectorAll("span")];
      const end = seg.at + seg.words[seg.words.length - 1][2];
      tl.fromTo(el, { opacity: 0, y: 12, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false }, seg.at - 0.12);
      if (k < V.length - 1) tl.to(el, { opacity: 0, y: -10, filter: "blur(3px)", duration: 0.16, ease: "power2.in" }, V[k + 1].at - 0.3);
      spans.forEach((s, i) => tl.fromTo(s, { opacity: 0.4 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, seg.at + seg.words[i][1] - 0.03));
    });

    const hit = (sel, at, scale) => {
      tl.fromTo(sel, { scale: 1 }, { scale, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
      tl.to(sel, { scale: 1, duration: 0.5, ease: "expo.out" }, at + 0.12);
    };
    tl.fromTo(".screens-rim", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, SYNC);
    tl.to(".screens-rim", { opacity: 0, duration: 0.9, ease: "power2.out" }, SYNC + 0.1);
    tl.fromTo([".screens-amt", "#screens-corner span"], { color: "#f3f5f8" }, { color: "#ffb347", duration: 0.1, ease: "power2.out", immediateRender: false }, SYNC);
    tl.to([".screens-amt", "#screens-corner span"], { color: "#f3f5f8", duration: 0.7, ease: "power2.out" }, SYNC + 0.2);
    hit(".screens-amt", SYNC, 1.05);
    hit("#screens-corner span", SYNC, 1.08);
    tl.set(".screens-amt", { transformOrigin: "0% 80%" }, 0);

    const lim = W(1, 3);
    tl.fromTo(".screens-note", { boxShadow: "0 0 0 1px #ff9f1c44 inset, 0 0 0px #ff9f1c00" }, { boxShadow: "0 0 0 3px #ff9f1c inset, 0 0 40px #ff9f1caa", duration: 0.14, ease: "power2.out", immediateRender: false }, lim);
    tl.to(".screens-note", { boxShadow: "0 0 0 1px #ff9f1c44 inset, 0 0 0px #ff9f1c00", duration: 0.9, ease: "power2.out" }, lim + 0.5);
    hit(".screens-note", lim, 1.06);
    tl.set(".screens-note", { transformOrigin: "0% 50%" }, 0);

    for (const [sel, at, hold] of [[".screens-bk", W(2, 1), 0.55], [".screens-of", W(2, 5), 0.9], [".screens-dc", W(2, 12) - 0.1, 0.6]]) {
      tl.fromTo(sel + " .screens-hl", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
      tl.to(sel + " .screens-hl", { opacity: 0, duration: 0.4, ease: "power2.out" }, at + hold);
      hit(sel, at, 1.04);
    }

    document.getElementById("screens-wave").innerHTML = "<i></i>".repeat(22);
    const bars = [...document.querySelectorAll("#screens-wave i")];
    const spoken = V.flatMap((s) => s.words.map((w) => [s.at + w[1], s.at + w[2]]));
    const level = (t) => {
      let lv = 0;
      for (const [a, b] of spoken) {
        const d = t < a ? a - t : t > b ? t - b : 0;
        lv = Math.max(lv, 1 - d / 0.09);
      }
      return Math.max(0, lv);
    };
    const waits = [...document.querySelectorAll("#screens .screens-wait")];
    const glows = [...document.querySelectorAll("#screens .screens-glow")];
    const dots = [...document.querySelectorAll("#screens .screens-status i")];
    const ring = document.getElementById("screens-ring");
    const pool = document.getElementById("screens-pool");
    const pav = document.querySelector(".screens-pav i");
    tl.eventCallback("onUpdate", () => {
      const t = tl.time();
      const lv = level(t);
      bars.forEach((b, i) => {
        const shape = 0.35 + 0.65 * Math.sin(((i + 0.5) / 22) * Math.PI);
        const jit = 0.65 + 0.35 * Math.sin(t * 23 + i * 1.9) * Math.sin(t * 7 + i * 0.7);
        b.style.height = 6 + 36 * lv * shape * jit + "px";
      });
      const s = 1 + Math.floor(Math.max(0, t - 1.05));
      waits.forEach((w) => (w.textContent = `Waiting 0:${String(s).padStart(2, "0")}`));
      const k = t >= SYNC ? 0.5 + 0.5 * Math.cos((2 * Math.PI * (t - SYNC)) / BREATH) : 0;
      const kick = t >= SYNC ? Math.max(0, 1 - (t - SYNC) / 0.8) : 0;
      glows.forEach((g) => (g.style.opacity = 0.32 + 0.28 * k + 0.4 * kick));
      dots.forEach((d) => (d.style.transform = `scale(${1 + 0.35 * k + 0.6 * kick})`));
      if (t >= 5.6) {
        const r = Math.min(1, 0.55 + 0.25 * k + 0.45 * lv);
        ring.style.opacity = r;
        pool.style.opacity = 0.45 + 0.35 * k + 0.3 * lv;
        pav.style.opacity = 0.5 + 0.5 * lv;
      }
    });

    tl.to({}, { duration: 0.01 }, 13.99);
    window.__timelines = window.__timelines || {};
    window.__timelines["screens"] = tl;
  </script>
</template>

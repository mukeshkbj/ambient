<template>
  <style>
    #fool { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #15130f; -webkit-font-smoothing: antialiased; }
    #fool * { box-sizing: border-box; }
    #fool .fool-ring { border-radius: 50%; background: conic-gradient(from 200deg, #5ad8ff, #3d7bff, #8a5cff, #5ad8ff); }

    #fool-title { position: absolute; left: 0; right: 0; top: 404px; text-align: center; font: 400 232px/1 Newsreader; letter-spacing: -.03em; white-space: nowrap; }
    #fool-title span { display: inline-block; }
    #fool-title em { font-style: italic; }

    #fool-sub { position: absolute; left: 280px; top: 196px; font: 500 30px/1 Inter; letter-spacing: -.015em; color: #777166; }
    #fool-sub b { font-weight: 600; color: #15130f; }

    #fool-pill { position: absolute; left: 280px; top: 254px; width: 1360px; height: 208px; border-radius: 64px; color: #f3f5f8;
      background: linear-gradient(180deg, #1d1f25, #0c0d10); box-shadow: 0 1px 0 #ffffff1f inset, 0 0 0 1px #0000002e, 0 28px 56px -14px #1a120873; }
    #fool-pill .fool-av { position: absolute; left: 36px; top: 36px; width: 72px; height: 72px; }
    #fool-pill .fool-av .fool-ring { position: absolute; inset: 0; -webkit-mask: radial-gradient(circle, #0000 26px, #000 27px); mask: radial-gradient(circle, #0000 26px, #000 27px); box-shadow: 0 0 28px #3d7bff99; }
    #fool-who { position: absolute; left: 140px; top: 34px; font: 600 22px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #9aa3b2; }
    #fool-pl { position: absolute; left: 140px; top: 74px; right: 40px; }
    .fool-pln { display: block; white-space: nowrap; font: 500 41px/62px Inter; letter-spacing: -.02em; }
    .fool-pln span { display: inline-block; white-space: pre; opacity: .26; }

    #fool-field { position: absolute; left: 280px; top: 494px; width: 1360px; height: 132px; border-radius: 40px; background: #ffffffe6;
      box-shadow: 0 0 0 1px #15130f0d, 0 1px 0 #fff inset, 0 34px 60px -30px #3a2c1a66; }
    #fool-field > b { position: absolute; left: 44px; top: 20px; font: 600 22px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #777166; }
    #fool-types { position: absolute; left: 44px; top: 50px; width: 1060px; height: 70px; }
    .fool-ty { position: absolute; left: 0; top: 0; white-space: pre; font: 500 54px/70px Inter; letter-spacing: -.03em; color: #15130f; }
    .fool-ty span { position: relative; display: inline-block; border-bottom: 5px solid transparent; line-height: 60px; opacity: 0; }
    .fool-ty span u { position: absolute; right: -4px; top: 8px; width: 4px; height: 44px; border-radius: 2px; background: #3d7bff; opacity: 0; text-decoration: none; }
    #fool-c0 { position: absolute; left: 44px; top: 58px; width: 4px; height: 44px; border-radius: 2px; background: #3d7bff; }
    #fool-send { position: absolute; right: 28px; top: 28px; width: 210px; height: 76px; border-radius: 26px; background: #15130f; color: #f3f5f8; font: 600 30px/76px Inter; letter-spacing: -.01em; text-align: center; box-shadow: 0 14px 24px -12px #15130f88; }
    #fool-send small { margin-left: 10px; font: 500 28px/1 Inter; opacity: .6; }
    #fool-send .fool-press { position: absolute; inset: 0; border-radius: inherit; background: #fff; opacity: 0; }

    #fool-vwrap { position: absolute; left: 280px; top: 658px; width: 1360px; height: 170px; }
    .fool-vd { position: absolute; inset: 0; display: flex; align-items: center; gap: 36px; padding: 0 44px; border-radius: 40px; opacity: 0; }
    .fool-no { background: #fff3f1; box-shadow: 0 0 0 1.5px #ff3b3036 inset, 0 30px 50px -30px #b4231866; }
    .fool-yes { background: #eefaf3; box-shadow: 0 0 0 1.5px #2fd37e66 inset, 0 30px 60px -26px #1f9d5c88; }
    .fool-vi { position: relative; flex: none; width: 84px; height: 84px; }
    .fool-vi svg { width: 84px; height: 84px; }
    .fool-vt b { display: block; font: 600 62px/1 Inter; letter-spacing: -.045em; }
    .fool-no .fool-vt b { color: #d92d20; } .fool-yes .fool-vt b { color: #168a4f; }
    .fool-vt span { display: block; margin-top: 12px; font: 500 34px/1.1 Inter; letter-spacing: -.015em; color: #5c564b; white-space: nowrap; }
    .fool-vt mark { padding: 2px 10px 4px; border-radius: 10px; background: #ff3b3022; color: #b42318; font-weight: 600; }
    #fool-halo { position: absolute; left: 0; top: 0; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #2fd37e; opacity: 0; }

    #fool-count { position: absolute; inset: 0; }
    #fool-big { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font: 600 380px/1 Inter; letter-spacing: -.055em; font-variant-numeric: tabular-nums; color: #15130f; }
    #fool-unit { position: absolute; left: 0; right: 0; top: 612px; text-align: center; font: 500 56px/1 Inter; letter-spacing: -.025em; color: #777166; }
    #fool-state { position: absolute; left: 0; right: 0; top: 716px; text-align: center; font: 400 104px/1.05 Newsreader; letter-spacing: -.03em; }
    #fool-state em { font-style: italic; }
  </style>

  <div id="fool" data-composition-id="fool" data-width="1920" data-height="1080">
    <div id="fool-title"><span>Try</span> <span>to</span> <span><em>fool</em></span> <span>it.</span></div>

    <div id="fool-panel">
      <div id="fool-sub"><b>You're the business.</b> Ambient just read the deal back:</div>

      <div id="fool-pill">
        <div class="fool-av"><div id="fool-avring" class="fool-ring"></div></div>
        <div id="fool-who">Ambient · AI</div>
        <div id="fool-pl">
          <span class="fool-pln">Okay, so just to confirm, one hundred sixty dollars total,</span>
          <span class="fool-pln">Tuesday the 20th at 10 am. Is that right?</span>
        </div>
      </div>

      <div id="fool-field">
        <b>Your answer</b>
        <div id="fool-types"></div>
        <div id="fool-c0"></div>
        <div id="fool-send"><div class="fool-press"></div>Answer<small>↵</small></div>
      </div>

      <div id="fool-vwrap"></div>
    </div>

    <div id="fool-count">
      <div id="fool-big">4,000</div>
      <div id="fool-unit">generated calls</div>
      <div id="fool-state">Not one booked without a <em>clean yes</em>.</div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const V0 = 0.45;
      const NO = '<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#e5372f"/><path d="M29 29l26 26M55 29L29 55" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>';
      const YES = '<div id="fool-halo"></div><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#1f9d5c"/><path id="fool-tick" d="M25 43l12 12 23-25" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const REPLIES = [
        { text: "Yes, plus parts.", flag: [5, 15], why: 'It adds words that can change the deal: <mark>"plus parts"</mark>.', T: 4.7 },
        { text: "Yes, Wednesday at ten.", flag: [5, 13], why: 'It names a day that was not read back: <mark>"wednesday"</mark>.' },
        { text: "Yeah, if nothing else breaks.", flag: [6, 28], why: 'It adds words that can change the deal: <mark>"if nothing else breaks"</mark>.' },
        { text: "Yes, that's right.", flag: null, why: "It is a clean yes to the exact terms that were read back." }
      ];
      const S = 0.018, HOLD = 0.98, GAP = 0.1;
      REPLIES.forEach((r, i) => {
        if (i) r.T = REPLIES[i - 1].C + GAP;
        r.E = r.T + [...r.text].length * S;
        r.V = r.E + 0.06;
        r.C = r.flag === null ? null : r.V + HOLD;
      });

      tl.fromTo("#fool-title span", { opacity: 0.2, y: 34, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out", stagger: 0.04 }, 0);
      tl.to("#fool-title", { opacity: 0, y: -46, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 0.42);
      tl.fromTo("#fool-pill", { opacity: 0, y: 50, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.5);
      tl.fromTo("#fool-sub", { opacity: 0, filter: "blur(8px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "expo.out" }, 0.56);
      tl.fromTo("#fool-field", { opacity: 0, y: 40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.66);

      const PHRASES = [[0, 1.2, 0, 5], [1.2, 2.48, 5, 10], [2.48, 3.2, 10, 13], [3.28, 4.08, 13, 16], [4.24, 4.8, 16, 19]];
      const words = [];
      $("#fool-pl").querySelectorAll(".fool-pln").forEach((line) => {
        const parts = line.textContent.split(" ");
        line.innerHTML = parts.map((w, i) => `<span>${w}${i < parts.length - 1 ? " " : ""}</span>`).join("");
        words.push(...line.querySelectorAll("span"));
      });
      PHRASES.forEach(([a, b, from, to]) => {
        const group = words.slice(from, to);
        const weights = group.map((w) => w.textContent.trim().length + 1.5);
        const total = weights.reduce((x, y) => x + y, 0);
        let acc = 0;
        group.forEach((w, i) => {
          tl.to(w, { opacity: 1, duration: 0.12, ease: "none" }, V0 + a + ((b - a) * acc) / total);
          acc += weights[i];
        });
      });

      const types = $("#fool-types");
      const vwrap = $("#fool-vwrap");
      REPLIES.forEach((r) => {
        const ty = document.createElement("div");
        ty.className = "fool-ty";
        const spans = [...r.text].map((ch) => {
          const sp = document.createElement("span");
          sp.textContent = ch;
          sp.appendChild(document.createElement("u"));
          ty.appendChild(sp);
          return sp;
        });
        types.appendChild(ty);
        spans.forEach((sp, k) => {
          const at = r.T + k * S;
          tl.set(sp, { opacity: 1 }, at);
          tl.set(sp.querySelector("u"), { opacity: 1 }, at);
          if (k < spans.length - 1) tl.set(sp.querySelector("u"), { opacity: 0 }, at + S);
        });
        tl.set(spans[spans.length - 1].querySelector("u"), { opacity: 0 }, r.E);
        if (r.C) tl.to(ty, { opacity: 0, y: -12, filter: "blur(3px)", duration: 0.1, ease: "power2.in" }, r.C);
        if (r.flag) {
          const flagged = spans.slice(r.flag[0], r.flag[1] + 1);
          tl.to(flagged, { color: "#d92d20", borderBottomColor: "#e5372f", duration: 0.1, ease: "power2.out" }, r.V);
          tl.to(spans.filter((s) => !flagged.includes(s)), { color: "#8a8478", duration: 0.16, ease: "power2.out" }, r.V);
        } else {
          tl.to(spans, { color: "#168a4f", duration: 0.16, ease: "power2.out" }, r.V);
        }

        tl.fromTo("#fool-send", { scale: 1 }, { scale: 0.94, duration: 0.06, ease: "power2.out", immediateRender: false }, r.E);
        tl.to("#fool-send", { scale: 1, duration: 0.28, ease: "back.out(3)" }, r.E + 0.06);
        tl.fromTo("#fool-send .fool-press", { opacity: 0 }, { opacity: 0.22, duration: 0.06, ease: "none", immediateRender: false }, r.E);
        tl.to("#fool-send .fool-press", { opacity: 0, duration: 0.22, ease: "power2.out" }, r.E + 0.06);

        const vd = document.createElement("div");
        vd.className = `fool-vd ${r.flag === null ? "fool-yes" : "fool-no"}`;
        vd.innerHTML = `<div class="fool-vi">${r.flag === null ? YES : NO}</div><div class="fool-vt"><b>${r.flag === null ? "Booked." : "Not booked."}</b><span>${r.why}</span></div>`;
        vwrap.appendChild(vd);
        tl.fromTo(vd, { opacity: 0, scale: 1.04 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, r.V);
        tl.fromTo(vd, { scale: 1.04 }, { scale: 1, duration: 0.32, ease: "expo.out", immediateRender: false }, r.V);
        if (r.C) {
          const x = vd.querySelector("svg");
          tl.fromTo(x, { scale: 2.1, rotation: -18, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.13, ease: "power4.in", transformOrigin: "50% 50%", immediateRender: false }, r.V);
          tl.fromTo(vd, { y: 0 }, { y: 5, duration: 0.04, ease: "power2.out", immediateRender: false }, r.V + 0.13);
          tl.to(vd, { y: 0, duration: 0.3, ease: "elastic.out(1.1, 0.4)" }, r.V + 0.17);
          tl.to(vd, { opacity: 0, y: -10, filter: "blur(3px)", duration: 0.14, ease: "power2.in" }, r.C);
          tl.fromTo("#fool-field", { x: 0 }, { x: -9, duration: 0.05, ease: "power2.out", immediateRender: false }, r.V);
          tl.to("#fool-field", { x: 0, duration: 0.4, ease: "elastic.out(1.2, 0.35)" }, r.V + 0.05);
        }
      });

      tl.set("#fool-c0", { opacity: 0 }, 0);
      tl.set("#fool-c0", { opacity: 1 }, 0.9);
      REPLIES.forEach((r) => {
        tl.set("#fool-c0", { opacity: 0 }, r.T - 0.02);
      });

      const last = REPLIES[REPLIES.length - 1];
      tl.fromTo("#fool-tick", { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, last.V + 0.06);
      tl.fromTo("#fool-halo", { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, last.V + 0.04);

      const OUT = last.V + 0.96;
      tl.to("#fool-panel", { opacity: 0, y: -14, filter: "blur(4px)", duration: 0.18, ease: "power2.in" }, OUT);
      tl.set("#fool-count > *", { opacity: 0 }, 0);
      tl.fromTo("#fool-big", { opacity: 0, y: 30, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, OUT + 0.14);
      const o = { v: 0 };
      const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      tl.fromTo(o, { v: 0 }, { v: 4000, duration: 1.0, ease: "expo.out", immediateRender: false, onUpdate: () => ($("#fool-big").firstChild.textContent = fmt(o.v)) }, OUT + 0.16);
      tl.fromTo("#fool-unit", { opacity: 0, y: 20, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, ease: "expo.out", immediateRender: false }, OUT + 0.32);
      tl.fromTo("#fool-state", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, OUT + 0.42);

      tl.fromTo("#fool-avring", { rotation: 0 }, { rotation: 1300, duration: 13, ease: "none" }, 0);
      const ring = $("#fool-avring");
      const SEG = PHRASES.map(([a, b]) => [V0 + a, V0 + b]);
      tl.eventCallback("onUpdate", () => {
        const t = tl.time();
        const live = SEG.some(([a, b]) => t >= a && t <= b);
        const env = live ? 0.65 + 0.35 * Math.sin(t * 38) : 0.12;
        ring.style.boxShadow = `0 0 ${14 + 34 * env}px #3d7bff${live ? "cc" : "66"}`;
      });

      tl.to({}, { duration: 0.01 }, 12.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["fool"] = tl;
    })();
  </script>
</template>

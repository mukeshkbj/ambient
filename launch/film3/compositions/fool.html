<template>
  <style>

    #fool-pill .fool-av .fool-ring { position: absolute; inset: 0; -webkit-mask: radial-gradient(circle, #0000 26px, #000 27px); mask: radial-gradient(circle, #0000 26px, #000 27px); box-shadow: 0 0 28px #3d7bff99; }

      box-shadow: 0 0 0 1px #15130f0d, 0 1px 0 #fff inset, 0 34px 60px -30px #3a2c1a66; }
    #fool-field > b { position: absolute; left: 44px; top: 22px; font: 600 20px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #a59e92; }
    #fool-types { position: absolute; left: 44px; top: 48px; width: 1060px; height: 70px; }

    #fool-send small { margin-left: 10px; font: 500 28px/1 Inter; opacity: .6; }
    #fool-send .fool-press { position: absolute; inset: 0; border-radius: inherit; background: #fff; opacity: 0; }

    #fool-vwrap { position: absolute; left: 280px; top: 524px; width: 1360px; height: 170px; }
    .fool-vd { position: absolute; inset: 0; display: flex; align-items: center; gap: 36px; padding: 0 44px; border-radius: 40px; opacity: 0; }
    .fool-no { background: #fff3f1; box-shadow: 0 0 0 1.5px #ff3b3036 inset, 0 30px 50px -30px #b4231866; }
    .fool-yes { background: #eefaf3; box-shadow: 0 0 0 1.5px #2fd37e66 inset, 0 30px 60px -26px #1f9d5c88; }

    .fool-vi svg { width: 84px; height: 84px; }
    .fool-vt b { display: block; font: 600 62px/1 Inter; letter-spacing: -.045em; }
    .fool-no .fool-vt b { color: #d92d20; } .fool-yes .fool-vt b { color: #168a4f; }
    .fool-vt span { display: block; margin-top: 12px; font: 500 34px/1.1 Inter; letter-spacing: -.015em; color: #5c564b; white-space: nowrap; }
    .fool-vt mark { padding: 2px 10px 4px; border-radius: 10px; background: #ff3b3022; color: #b42318; font-weight: 600; }
    #fool-halo { position: absolute; left: 0; top: 0; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #2fd37e; opacity: 0; }

    #fool-ledger > b { display: block; margin-bottom: 14px; font: 600 20px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #a59e92; }
    .fool-hr { position: relative; display: flex; align-items: center; gap: 18px; height: 52px; border-top: 1px solid #15130f14; font: 500 28px/1 Inter; letter-spacing: -.015em; color: #15130f; }
    .fool-hr svg { width: 24px; height: 24px; flex: none; }
    .fool-hr em { margin-left: auto; font: 500 26px/1 Inter; font-style: normal; color: #777166; }

    #fool-stack { position: absolute; inset: 0; transform: translateY(230px); }
    #fool-count { position: absolute; inset: 0; }
    #fool-big { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font: 600 380px/1 Inter; letter-spacing: -.055em; font-variant-numeric: tabular-nums; color: #15130f; }
    #fool-unit { position: absolute; left: 0; right: 0; top: 566px; text-align: center; font: 500 56px/1 Inter; letter-spacing: -.025em; color: #777166; }
    #fool-state { position: absolute; left: 0; right: 0; top: 670px; text-align: center; font: 400 104px/1.05 Newsreader; letter-spacing: -.03em; }
    #fool-state em { font-style: italic; }
    #fool-corpus { position: absolute; left: 0; right: 0; top: 842px; display: flex; justify-content: center; }
    #fool-corpus div { display: flex; align-items: center; gap: 18px; padding: 18px 34px 18px 22px; border-radius: 999px; background: #ffffffd9; box-shadow: 0 0 0 1px #00000010, 0 24px 50px -28px #3a2c1a66; font: 500 34px/1 Inter; letter-spacing: -.02em; color: #5c564b; }
    #fool-corpus svg { width: 44px; height: 44px; }
    #fool-corpus b { font-weight: 600; color: #15130f; font-variant-numeric: tabular-nums; }
    #fool-fine { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 500 22px/1 Inter; color: #a59e92; }
  </style>

  <div id="fool" data-composition-id="fool" data-width="1920" data-height="1080">
    <div id="fool-title"><span>Try</span> <span>to</span> <span><em>fool</em></span> <span>it.</span></div>

    <div id="fool-panel"><div id="fool-stack">
      <div id="fool-sub"><b>You're the business.</b> Ambient just read the deal back:</div>

      <div id="fool-pill">
        <div class="fool-av"><div id="fool-avring" class="fool-ring"></div></div>
        <div id="fool-who">Ambient · AI</div>
        <div id="fool-pl">
          <span class="fool-pln">Okay, so just to confirm, one hundred sixty dollars total,</span>
          <span class="fool-pln">Tuesday the 20th at 10 am. Is that right?</span>
        </div>
      </div>

      <div id="fool-field">
        <b>Your answer</b>
        <div id="fool-types"></div>
        <div id="fool-c0"></div>
        <div id="fool-send"><div class="fool-press"></div>Answer<small>↵</small></div>
      </div>

      </div>
      <div id="fool-vwrap"></div>

      <div id="fool-ledger"><b>Tried so far</b></div>
    </div>

    <div id="fool-count">
      <div id="fool-big">4,000</div>
      <div id="fool-unit">generated calls</div>
      <div id="fool-state">Not one booked without a <em>clean yes</em>.</div>
      <div id="fool-corpus"><div><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#1f9d5c"/><path d="M12.5 23l6.5 6.5L31.5 15" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Plus <b>192</b> labelled business replies</span></div></div>
      <div id="fool-fine">Seeded property test · test/call-honesty.test.ts · test/read-back-replies.test.ts</div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const V0 = 0.85;
      const NO = '<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#e5372f"/><path d="M29 29l26 26M55 29L29 55" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>';
      const NO_SM = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#e5372f"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
      const YES = '<div id="fool-halo"></div><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="42" fill="#1f9d5c"/><path id="fool-tick" d="M25 43l12 12 23-25" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const REPLIES = [
        { text: "Yes, plus parts.", flag: [5, 15], why: 'It adds words that can change the deal: <mark>"plus parts"</mark>.', plain: 'It adds words that can change the deal: "plus parts".', T: 5.6, s: 0.04, C: 6.98 },
        { text: "Sure, one eighty.", flag: [6, 16], why: 'It has a number that was not read back: <mark>"one eighty"</mark>.', plain: 'It has a number that was not read back: "one eighty".', T: 7.06, s: 0.04, C: 8.5 },
        { text: "Yes, Wednesday at ten.", flag: [5, 13], why: 'It names a day that was not read back: <mark>"wednesday"</mark>.', plain: 'It names a day that was not read back: "wednesday".', T: 8.58, s: 0.034, C: 10.08 },
        { text: "Yeah, if nothing else breaks.", flag: [6, 28], why: 'It adds words that can change the deal: <mark>"if nothing else breaks"</mark>.', plain: 'It adds words that can change the deal: "if nothing else breaks".', T: 10.16, s: 0.022, C: 11.55 },
        { text: "One sixty, Tuesday the 20th at 10 am.", flag: "dim", why: "It has no word of agreement.", plain: "It has no word of agreement.", T: 11.63, s: 0.025, C: 13.45 },
        { text: "Yes, that's right.", flag: null, why: "It is a clean yes to the exact terms that were read back.", T: 13.53, s: 0.035, C: null }
      ];
      REPLIES.forEach((r) => { r.E = r.T + [...r.text].length * r.s + 0.04; r.V = r.E + 0.06; });

      tl.fromTo("#fool-title span", { opacity: 0.2, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out", stagger: 0.06 }, 0);
      tl.to("#fool-title", { opacity: 0, y: -50, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 0.64);
      tl.fromTo("#fool-sub", { opacity: 0, filter: "blur(8px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "expo.out" }, 0.92);
      tl.fromTo("#fool-pill", { opacity: 0, y: 60, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, 0.84);
      tl.fromTo("#fool-field", { opacity: 0, y: 40, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 1.02);

      const PHRASES = [[0, 1.2, 0, 5], [1.2, 2.48, 5, 10], [2.48, 3.2, 10, 13], [3.28, 4.08, 13, 16], [4.24, 4.8, 16, 19]];
      const words = [];
      $("#fool-pl").querySelectorAll(".fool-pln").forEach((line) => {
        const parts = line.textContent.split(" ");
        line.innerHTML = parts.map((w, i) => `<span>${w}${i < parts.length - 1 ? " " : ""}</span>`).join("");
        words.push(...line.querySelectorAll("span"));
      });
      PHRASES.forEach(([a, b, from, to]) => {
        const group = words.slice(from, to);
        const weights = group.map((w) => w.textContent.trim().length + 1.5);
        const total = weights.reduce((x, y) => x + y, 0);
        let acc = 0;
        group.forEach((w, i) => {
          tl.to(w, { opacity: 1, duration: 0.12, ease: "none" }, V0 + a + ((b - a) * acc) / total);
          acc += weights[i];
        });
      });

      tl.fromTo("#fool-stack", { y: 230 }, { y: 0, duration: 0.9, ease: "expo.inOut", immediateRender: false }, 4.75);
      const types = $("#fool-types");
      const vwrap = $("#fool-vwrap");
      const ledger = $("#fool-ledger");
      REPLIES.forEach((r, ri) => {
        const ty = document.createElement("div");
        ty.className = "fool-ty";
        const spans = [...r.text].map((ch) => {
          const sp = document.createElement("span");
          sp.textContent = ch;
          sp.appendChild(document.createElement("u"));
          ty.appendChild(sp);
          return sp;
        });
        types.appendChild(ty);
        spans.forEach((sp, k) => {
          const at = r.T + k * r.s;
          tl.set(sp, { opacity: 1 }, at);
          tl.set(sp.querySelector("u"), { opacity: 1 }, at);
          if (k < spans.length - 1) tl.set(sp.querySelector("u"), { opacity: 0 }, at + r.s);
        });
        tl.set(spans[spans.length - 1].querySelector("u"), { opacity: 0 }, r.E);
        if (r.C) tl.to(ty, { opacity: 0, y: -12, filter: "blur(3px)", duration: 0.16, ease: "power2.in" }, r.C);
        if (Array.isArray(r.flag)) {
          const flagged = spans.slice(r.flag[0], r.flag[1] + 1);
          tl.to(flagged, { color: "#d92d20", borderBottomColor: "#e5372f", duration: 0.14, ease: "power2.out" }, r.V);
          tl.to(spans.filter((s) => !flagged.includes(s)), { color: "#8a8478", duration: 0.2, ease: "power2.out" }, r.V);
        } else if (r.flag === "dim") {
          tl.to(spans, { color: "#8a8478", duration: 0.2, ease: "power2.out" }, r.V);
        } else {
          tl.to(spans, { color: "#168a4f", duration: 0.2, ease: "power2.out" }, r.V);
        }

        tl.fromTo("#fool-send", { scale: 1 }, { scale: 0.96, duration: 0.07, ease: "power2.out", immediateRender: false }, r.E);
        tl.to("#fool-send", { scale: 1, duration: 0.3, ease: "back.out(3)" }, r.E + 0.07);
        tl.fromTo("#fool-send .fool-press", { opacity: 0 }, { opacity: 0.2, duration: 0.07, ease: "none", immediateRender: false }, r.E);
        tl.to("#fool-send .fool-press", { opacity: 0, duration: 0.25, ease: "power2.out" }, r.E + 0.07);

        const vd = document.createElement("div");
        vd.className = `fool-vd ${r.flag === null ? "fool-yes" : "fool-no"}`;
        vd.innerHTML = `<div class="fool-vi">${r.flag === null ? YES : NO}</div><div class="fool-vt"><b>${r.flag === null ? "Booked." : "Not booked."}</b><span>${r.why}</span></div>`;
        vwrap.appendChild(vd);
        tl.fromTo(vd, { opacity: 0, y: 16, scale: 0.955, filter: "blur(3px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "back.out(2)", immediateRender: false }, r.V);
        if (r.C) {
          tl.to(vd, { opacity: 0, y: -10, filter: "blur(3px)", duration: 0.16, ease: "power2.in" }, r.C);
          tl.fromTo("#fool-field", { x: 0 }, { x: -9, duration: 0.05, ease: "power2.out", immediateRender: false }, r.V);
          tl.to("#fool-field", { x: 0, duration: 0.4, ease: "elastic.out(1.2, 0.35)" }, r.V + 0.05);
          const hr = document.createElement("div");
          hr.className = "fool-hr";
          hr.innerHTML = `${NO_SM}<span></span><em></em>`;
          hr.querySelector("span").textContent = r.text;
          hr.querySelector("em").textContent = r.plain;
          ledger.appendChild(hr);
          tl.fromTo(hr, { opacity: 0, y: -150, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, r.C + 0.02);
        }
      });
      tl.set("#fool-ledger .fool-hr", { opacity: 0 }, 0);
      tl.set("#fool-ledger", { opacity: 0 }, 0);
      tl.fromTo("#fool-ledger", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, REPLIES[0].C);

      tl.set("#fool-c0", { opacity: 0 }, 0);
      tl.set("#fool-c0", { opacity: 1 }, 1.2);
      REPLIES.forEach((r) => {
        tl.set("#fool-c0", { opacity: 0 }, r.T - 0.02);
        if (r.C) tl.set("#fool-c0", { opacity: 1 }, r.C + 0.06);
      });

      const last = REPLIES[REPLIES.length - 1];
      tl.fromTo("#fool-tick", { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, last.V + 0.1);
      tl.fromTo("#fool-halo", { scale: 1, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, last.V + 0.05);

      const OUT = 15.0;
      tl.to("#fool-panel", { opacity: 0, y: -14, filter: "blur(4px)", duration: 0.2, ease: "power2.in" }, OUT);
      tl.set("#fool-count > *", { opacity: 0 }, 0);
      tl.fromTo("#fool-big", { opacity: 0, y: 30, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, OUT + 0.18);
      const o = { v: 0 };
      const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      tl.fromTo(o, { v: 0 }, { v: 4000, duration: 1.3, ease: "expo.out", immediateRender: false, onUpdate: () => ($("#fool-big").firstChild.textContent = fmt(o.v)) }, OUT + 0.2);
      tl.fromTo("#fool-unit", { opacity: 0, y: 20, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out", immediateRender: false }, OUT + 0.42);
      tl.fromTo("#fool-state", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, OUT + 0.7);
      tl.fromTo("#fool-corpus", { opacity: 0, y: 20, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: false }, OUT + 1.2);
      tl.fromTo("#fool-corpus svg", { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "back.out(2.6)", transformOrigin: "50% 50%", immediateRender: false }, OUT + 1.3);
      tl.fromTo("#fool-fine", { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, OUT + 1.45);

      tl.fromTo("#fool-avring", { rotation: 0 }, { rotation: 1800, duration: 18, ease: "none" }, 0);
      const ring = $("#fool-avring");
      const SEG = PHRASES.map(([a, b]) => [V0 + a, V0 + b]);
      tl.eventCallback("onUpdate", () => {
        const t = tl.time();
        const live = SEG.some(([a, b]) => t >= a && t <= b);
        const env = live ? 0.65 + 0.35 * Math.sin(t * 38) : 0.12;
        ring.style.boxShadow = `0 0 ${14 + 34 * env}px #3d7bff${live ? "cc" : "66"}`;
      });

      tl.to({}, { duration: 0.01 }, 17.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["fool"] = tl;
    })();
  </script>
</template>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient — Alexa+ simulator</title>
<style>
:root{
  --bg:#05070d;--panel:#0d1220;--panel2:#121828;--line:#1f2942;--fg:#e8edf6;--dim:#8b96ad;
  --cyan:#4cc9f0;--blue:#4361ee;--amber:#ffb454;--red:#ff6b6b;--green:#4ade80;
  --glow:0 0 60px rgba(76,201,240,.35);
}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 700px at 30% -10%,#101a33 0%,var(--bg) 55%);color:var(--fg);
  font:15px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
header .brand{font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--cyan)}
header .sub{color:var(--dim);font-size:12px}
.devices{margin-left:auto;display:flex;gap:6px}
.devices button{font:12px/1 inherit;padding:7px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);cursor:pointer;transition:.15s}
.devices button.on{border-color:var(--cyan);color:var(--fg);background:var(--panel2)}
main{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0}
/* voice panel */
.voice{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px;gap:16px}
.orbwrap{position:relative;width:170px;height:170px;margin:8px auto}
.ring{position:absolute;inset:-14px;border-radius:50%;border:3px solid transparent;transition:.3s}
.ring.attention{border-color:var(--amber);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(255,180,84,.25)}50%{box-shadow:0 0 42px rgba(255,180,84,.65)}}
.orb{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#67e8f9 0%,var(--blue) 55%,#131b3a 100%);
  box-shadow:var(--glow),inset 0 0 30px rgba(0,0,0,.45);transition:.3s}
.orb.listening{animation:spin 3s linear infinite}
.orb.speaking{animation:breathe 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.state{text-align:center;color:var(--dim);font-size:13px;min-height:20px}
.transcript{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.msg{max-width:92%;padding:9px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--blue);border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.msg.event{align-self:center;background:none;color:var(--dim);font-size:12px;padding:2px}
.msg.event b{color:var(--fg)}
.inputrow{display:flex;gap:8px}
.inputrow input{flex:1;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;color:var(--fg);outline:none}
.inputrow input:focus{border-color:var(--cyan)}
button.act{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;cursor:pointer}
button.act:hover{border-color:var(--cyan)}
button.mic.listening{border-color:var(--red);color:var(--red)}
/* device panel */
.devicepanel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;min-width:0}
.screen{position:relative;border:1px solid var(--line);border-radius:14px;background:#000;
  overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.5);transition:width .3s,height .3s}
.screen iframe{width:100%;height:100%;border:0;display:block}
.screen .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13px;text-align:center;padding:20px}
.devlabel{color:var(--dim);font-size:12px;letter-spacing:.1em}
/* elicitation card */
.elicit{position:fixed;right:24px;bottom:24px;width:320px;background:var(--panel2);border:1px solid var(--amber);
  border-radius:14px;padding:14px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:10}
.elicit.show{display:block}
.elicit p{font-size:13px;margin-bottom:10px}
.elicit .row{display:flex;gap:8px}
.elicit button{flex:1;font:inherit;padding:8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.elicit button.approve{border-color:var(--green);color:var(--green)}
.elicit button.deny{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<header>
  <span class="brand">AMBIENT</span>
  <span class="sub">Alexa+ simulator — a real MCP client on <code>/mcp</code></span>
  <nav class="devices" id="devices"></nav>
</header>
<main>
  <section class="voice">
    <div class="orbwrap"><div class="ring" id="ring"></div><div class="orb" id="orb"></div></div>
    <div class="state" id="state">Say something — or type below</div>
    <div class="transcript" id="transcript"><div class="msg event">Your agents work in the background. I'll tell you when they need you.</div></div>
    <div class="inputrow">
      <input id="utter" placeholder="e.g. Book a table for Saturday" autocomplete="off" autofocus>
      <button class="act mic" id="mic" title="Voice input">&#9679;</button>
      <button class="act" id="send">Ask</button>
    </div>
  </section>
  <section class="devicepanel">
    <div class="devlabel" id="devlabel"></div>
    <div class="screen" id="screen">
      <iframe id="view" title="MCP App view"></iframe>
      <div class="empty" id="empty">No display output yet.<br>Ask something that needs a visual.</div>
    </div>
  </section>
</main>
<div class="elicit" id="elicit">
  <p id="elicitMsg"></p>
  <div class="row">
    <button class="approve" data-d="approve_once">Approve once</button>
    <button class="deny" data-d="deny">Deny</button>
    <button data-d="decline">Later</button>
  </div>
</div>
<script>
const DEVICES = {
  "voice-only":  { cls:"voice",   label:"Voice only" },
  "mobile":      { cls:"mobile",  label:"Mobile",      w:393,  h:852  },
  "echo-show-8": { cls:"display", label:"Echo Show 8", w:960,  h:480  },
  "echo-show-15":{ cls:"display", label:"Echo Show 15",w:1280, h:800  },
  "fire-tv":     { cls:"tv",      label:"Fire TV",     w:1920, h:1080 }
};
const state = { device:"echo-show-8", elicit:null, viewResource:null, listening:false };
const $ = id => document.getElementById(id);

// device switcher
const nav = $("devices");
for (const id of Object.keys(DEVICES)) {
  const b = document.createElement("button");
  b.textContent = DEVICES[id].label; b.dataset.d = id;
  b.onclick = () => setDevice(id);
  nav.appendChild(b);
}
function setDevice(id){
  state.device = id;
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.d === id));
  const d = DEVICES[id], screen = $("screen"), view = $("view");
  $("devlabel").textContent = d.label + (d.w ? ` — ${d.w}×${d.h}` : "");
  if (d.w) { screen.style.width = "min("+d.w+"px,90%)"; screen.style.height = "";
    const ratio = d.h/d.w; screen.style.height = Math.min(innerHeight*.72, screen.getBoundingClientRect().width*ratio)+"px";
    view.style.display=""; }
  else { screen.style.width="0"; screen.style.height="0"; screen.style.border="0"; }
  const win = view.contentWindow;
  if (win && state.viewResource) win.postMessage({ jsonrpc:"2.0",
    method:"ui/notifications/host-context-changed", params:{ hostContext: hostContext() } }, "*");
}
setDevice(state.device);
addEventListener("resize", () => setDevice(state.device));

// transcript + speech
const synth = window.speechSynthesis;
function say(text){
  if (!synth || !text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = 1.02;
  u.onstart = () => $("orb").classList.add("speaking");
  u.onend = () => $("orb").classList.remove("speaking");
  synth.speak(u);
}
function addMsg(text, cls){
  const div = document.createElement("div");
  div.className = "msg " + cls; div.textContent = text;
  $("transcript").appendChild(div);
  div.scrollIntoView({behavior:"smooth",block:"end"});
  return div;
}

// turns
async function send(utterance){
  utterance = utterance.trim(); if (!utterance) return;
  addMsg(utterance, "user"); $("utter").value = "";
  $("state").textContent = "Thinking…"; $("orb").classList.add("listening");
  try {
    const r = await fetch("/sim/api/turn", {method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({utterance, device: state.device})}).then(r => r.json());
    if (r.speech) { addMsg(r.speech, "agent"); say(r.speech); }
    else if (r.error) addMsg("Error: " + r.error, "agent");
    if (r.ui && r.ui.html) loadView(r.ui.resourceUri, r.ui.html, r.structuredContent);
  } catch (e) { addMsg("Couldn't reach the Ambient server.", "agent"); }
  finally { $("orb").classList.remove("listening"); $("state").textContent = "Say something — or type below"; }
}
$("send").onclick = () => send($("utter").value);
$("utter").addEventListener("keydown", e => { if (e.key === "Enter") send($("utter").value); });

// voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("mic").style.display = SR ? "" : "none";
if (SR) $("mic").onclick = () => {
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onstart = () => { state.listening = true; $("mic").classList.add("listening"); $("state").textContent = "Listening…"; };
  rec.onend = () => { state.listening = false; $("mic").classList.remove("listening"); };
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.start();
};

// MCP Apps host: load a ui:// resource into the device frame and answer its protocol calls
function loadView(uri, html, structured){
  state.viewResource = uri;
  if (structured) state.lastStructured = structured;
  $("empty").style.display = "none";
  $("view").dataset.payload = JSON.stringify(state.lastStructured ?? {});
  $("view").srcdoc = html;
}
$("view").addEventListener("load", () => {
  const win = $("view").contentWindow;
  if (win && state.lastStructured) win.postMessage({ jsonrpc:"2.0",
    method:"ui/notifications/tool-result", params:{ structuredContent: state.lastStructured } }, "*");
});
function hostContext(){
  const d = DEVICES[state.device], screen = $("screen").getBoundingClientRect();
  return {
    deviceClass: d.cls,
    device: state.device,
    theme: "dark",
    displayDimensions: d.w ? { width: d.w, height: d.h } : { width: Math.round(screen.width), height: Math.round(screen.height) },
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
}
addEventListener("message", async e => {
  const m = e.data;
  if (!m || m.jsonrpc !== "2.0" || e.source !== $("view").contentWindow) return;
  const reply = (result) => e.source.postMessage({ jsonrpc:"2.0", id:m.id, result }, "*");
  if (m.id !== undefined && m.method === "ui/initialize") {
    reply({ protocolVersion:"2025-11-25", hostInfo:{ name:"Ambient Sim", version:"0.1.0" }, hostContext: hostContext() });
    const payload = $("view").dataset.payload;
    if (payload) e.source.postMessage({ jsonrpc:"2.0", method:"ui/notifications/tool-result", params:{ structuredContent: JSON.parse(payload) } }, "*");
    return;
  }
  if (m.id !== undefined && m.method === "tools/call") {
    try {
      const r = await fetch("/sim/api/tool", {method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({ name:m.params?.name, arguments:m.params?.arguments ?? {} })}).then(r => r.json());
      reply({ content:[{type:"text",text:r.speech ?? ""}], structuredContent: r.structuredContent ?? {}, isError: r.isError === true });
      if (r.speech) { addMsg(r.speech, "agent"); say(r.speech); }
      if (r.ui && r.ui.html) loadView(r.ui.resourceUri, r.ui.html, r.structuredContent);
    } catch (err) {
      e.source.postMessage({ jsonrpc:"2.0", id:m.id, error:{ code:-32000, message:String(err?.message||err) } }, "*");
    }
    return;
  }
  if (m.id !== undefined) reply({}); // any other ui/* request → empty ack
});

// live events: run ticks + needs-you ring + elicitation card
const events = new EventSource("/sim/api/events");
events.onmessage = e => {
  const ev = JSON.parse(e.data);
  if (ev.type === "run" && ev.run) {
    addMsg(`${ev.run.assistant ? ev.run.assistant + " — " : ""}"${ev.run.title}" → ${ev.run.status.replace("_"," ")}`, "event");
    if (ev.view) {
      state.lastStructured = ev.view;
      if (state.viewResource === "ui://ambient/task") pushStructured(ev.view);
      else if (state.viewResource === "ui://ambient/dashboard") refreshDashboard();
    }
    if (!state.viewResource) openTaskView();
  }
  if (ev.type === "attention") $("ring").classList.toggle("attention", ev.pending > 0);
  if (ev.type === "elicit") showElicit(ev);
};
function pushStructured(structured){
  const v = $("view").contentWindow;
  if (v) v.postMessage({ jsonrpc:"2.0", method:"ui/notifications/tool-result",
    params:{ structuredContent: structured ?? {} } }, "*");
}
async function refreshDashboard(){
  const r = await fetch("/sim/api/tool", {method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({name:"dashboard",arguments:{}})}).then(r=>r.json());
  if (r.structuredContent) pushStructured(r.structuredContent);
}
// A run started — show the task view right away instead of waiting for the turn to end.
async function openTaskView(){
  try {
    const r = await fetch("/sim/api/resource?uri=" + encodeURIComponent("ui://ambient/task")).then(r => r.ok ? r.json() : undefined);
    if (r && r.html) loadView(r.resourceUri, r.html, state.lastStructured);
  } catch {}
}
function showElicit(ev){
  state.elicit = ev.id;
  $("elicitMsg").textContent = ev.message;
  $("elicit").classList.add("show");
  $("ring").classList.add("attention");
  $("state").textContent = "Your approval is needed";
  say(ev.message);
}
document.querySelectorAll("#elicit button").forEach(b => b.onclick = async () => {
  if (!state.elicit) return;
  await fetch("/sim/api/elicit", {method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({ id: state.elicit, decision: b.dataset.d })});
  state.elicit = null;
  $("elicit").classList.remove("show");
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incoming call · Ambient</title>
<style>
:root{
  color-scheme:dark;
  --bg:oklch(0.18 0.012 250);
  --ink:oklch(0.97 0.004 250);
  --ink-2:oklch(0.80 0.01 250);
  --ink-3:oklch(0.68 0.01 250);
  --line:oklch(0.32 0.012 250);
  --ai:oklch(0.80 0.11 225);
  --answer:oklch(0.62 0.17 150);
  --end:oklch(0.58 0.21 27);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;padding:max(48px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom));text-align:center}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:3px}
.top{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:24px}
.state{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
h1{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ai{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ai);border:1px solid oklch(0.80 0.11 225 / .4);border-radius:999px;padding:4px 12px}
.why{max-width:320px;color:var(--ink-2);font-size:15px}
.about{margin:6px 0 0;font-size:18px;color:oklch(0.86 0.01 255);text-align:center;text-wrap:balance}
.about:empty{display:none}
.avatar{margin:40px 0 0;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:oklch(0.22 0.015 250);box-shadow:0 0 0 2px oklch(0.80 0.11 225 / .4);position:relative}
.avatar::before{content:"";width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 45%,oklch(0.22 0.015 250) 0 42%,transparent 44%),conic-gradient(from 200deg,oklch(0.80 0.11 225),oklch(0.72 0.12 210),oklch(0.80 0.11 225))}
.avatar::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid oklch(0.80 0.11 225 / .8);opacity:0}
body[data-state="ringing"] .avatar::after,body[data-state="speaking"] .avatar::after{animation:ring 1.8s cubic-bezier(0.2,0,0,1) infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.captions{margin-top:28px;width:100%;max-width:380px;min-height:120px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.cap{font-size:15px;line-height:1.4;text-align:left;color:var(--ink-2)}
.cap b{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:1px}
.cap.agent b{color:var(--ai)}
.spacer{flex:1}
.actions{display:flex;gap:72px;justify-content:center;align-items:flex-start}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.round{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;transition:transform 150ms ease-out}
.round:active{transform:scale(.94)}
.round svg{width:32px;height:32px}
.answer{background:var(--answer)}
.end{background:var(--end)}
.end svg{transform:rotate(135deg)}
.hidden{display:none !important}
.note{margin-top:20px;font-size:13px;color:var(--ink-3);max-width:320px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body data-state="ringing">
<div class="top">
  <span class="state" id="state">Incoming call</span>
  <h1>Ambient</h1>
  <span class="ai">AI assistant</span>
  <p class="why" id="why">Calling for a customer. This call is transcribed.</p>
  <p class="about" id="about"></p>
</div>
<div class="avatar" aria-hidden="true"></div>
<div class="captions" id="captions" aria-live="polite"></div>
<div class="spacer"></div>
<div class="actions" id="ringingActions">
  <div class="act"><button class="round end" id="decline" type="button" aria-label="Decline"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>Decline</div>
  <div class="act"><button class="round answer" id="answer" type="button" aria-label="Answer"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>Answer</div>
</div>
<div class="actions hidden" id="liveActions">
  <div class="act"><button class="round end" id="hangup" type="button" aria-label="End call"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>End</div>
</div>
<p class="note" id="note">You're the business in this demo. Answer, then talk naturally: quote a price, offer a time.</p>

<script>
const $ = id => document.getElementById(id);
const base = location.pathname.replace(/\/$/, "");
const call = { ws: null, ctx: null, mic: null, node: null, sources: new Set(), playAt: 0, replying: false, expectReply: false, endAfterReply: false, ended: false, started: 0, timer: null, pageKey: "", agentText: "", flushes: 0 };

const WORKLET = `
class Mic extends AudioWorkletProcessor {
  constructor(options) { super(); this.ratio = options.processorOptions.inputSampleRate / 24000; this.pos = 0; this.prev = undefined; this.out = []; }
  process(inputs) {
    const channel = inputs[0] && inputs[0][0];
    if (!channel) return true;
    const data = this.prev === undefined ? channel : Float32Array.of(this.prev, ...channel);
    let t = this.pos;
    while (t < data.length - 1) { const i = Math.floor(t), f = t - i; this.out.push(data[i] * (1 - f) + data[i + 1] * f); t += this.ratio; }
    this.pos = t - (data.length - 1);
    this.prev = data[data.length - 1];
    if (this.out.length >= 1200) {
      const pcm = new Int16Array(this.out.length);
      for (let i = 0; i < this.out.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(this.out[i] * 32767)));
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
      this.out = [];
    }
    return true;
  }
}
registerProcessor("mic", Mic);`;

function post(path, body) {
  return fetch(base + path, { method: "POST", headers: { "content-type": "application/json", "x-page-key": call.pageKey }, body: JSON.stringify(body ?? {}), keepalive: true });
}
function setState(state, label) {
  document.body.dataset.state = state;
  if (label) $("state").textContent = label;
}
function caption(who, text, role) {
  const box = $("captions");
  const div = document.createElement("div");
  div.className = "cap " + role;
  div.innerHTML = "<b></b><span></span>";
  div.querySelector("b").textContent = who;
  div.querySelector("span").textContent = text;
  box.appendChild(div);
  while (box.children.length > 4) box.firstChild.remove();
}
const toBase64 = buffer => { let s = ""; const bytes = new Uint8Array(buffer); for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); };

function play(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
  const buffer = call.ctx.createBuffer(1, pcm.length, 24000);
  const channel = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 32768;
  const source = call.ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(call.ctx.destination);
  call.playAt = Math.max(call.playAt, call.ctx.currentTime);
  source.start(call.playAt);
  call.playAt += buffer.duration;
  call.sources.add(source);
  source.onended = () => call.sources.delete(source);
}
function flushPlayback() {
  for (const source of call.sources) { try { source.stop(); } catch {} }
  call.sources.clear();
  call.playAt = 0;
  call.flushes += 1;
}

function end(reason) {
  if (call.ended) return;
  call.ended = true;
  try { call.ws?.send(JSON.stringify({ type: "session.end" })); } catch {}
  try { call.ws?.close(); } catch {}
  call.mic?.getTracks().forEach(track => track.stop());
  clearInterval(call.timer);
  post("/event", { type: "ended" });
  setState("ended", reason ?? "Call ended");
  $("liveActions").classList.add("hidden");
  $("ringingActions").classList.add("hidden");
  $("note").textContent = "You can close this page.";
}

fetch(base + "/info").then(r => r.ok ? r.json() : null).then(info => {
  if (info?.ownerName) $("why").textContent = `Calling for ${info.ownerName}. This call is transcribed.`;
  if (info?.about) $("about").textContent = `About: ${info.about.charAt(0).toLowerCase()}${info.about.slice(1)}.`;
}).catch(() => {});

const events = new EventSource(base + "/events");
events.onmessage = e => {
  const event = JSON.parse(e.data);
  if (event.type === "speak" && call.ws?.readyState === 1) {
    call.expectReply = true;
    call.ws.send(JSON.stringify({ type: "reply.create" }));
  }
  if (event.type === "hangup") {
    call.endAfterReply = true;
    if (!call.replying && !call.expectReply && call.sources.size === 0) setTimeout(() => end("Ambient ended the call"), 400);
    setTimeout(() => end("Ambient ended the call"), 12000);
  }
};

$("decline").onclick = () => end("Declined");
$("hangup").onclick = () => end("You ended the call");
addEventListener("pagehide", () => end());

$("answer").onclick = async () => {
  $("answer").disabled = true;
  setState("connecting", "Connecting…");
  try {
    call.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true } });
    call.ctx = new AudioContext();
    await call.ctx.resume();
    await call.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
    const session = await post("/session").then(r => { if (!r.ok) throw new Error("This call is no longer available."); return r.json(); });
    call.pageKey = session.pageKey;
    $("why").textContent = `Calling for ${session.ownerName}. This call is transcribed.`;
    const url = new URL("wss://agents.assemblyai.com/v1/ws");
    url.searchParams.set("token", session.token);
    const ws = new WebSocket(url);
    call.ws = ws;
    ws.onopen = () => ws.send(JSON.stringify({ type: "session.update", session: { agent_id: session.agentId } }));
    ws.onmessage = async message => {
      const event = JSON.parse(message.data);
      switch (event.type) {
        case "session.ready": {
          const input = call.ctx.createMediaStreamSource(call.mic);
          call.node = new AudioWorkletNode(call.ctx, "mic", { processorOptions: { inputSampleRate: call.ctx.sampleRate } });
          call.node.port.onmessage = chunk => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: "input.audio", audio: toBase64(chunk.data) })); };
          input.connect(call.node);
          call.started = Date.now();
          call.timer = setInterval(() => {
            const s = Math.floor((Date.now() - call.started) / 1000);
            $("state").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
          }, 1000);
          setState("live", "0:00");
          $("ringingActions").classList.add("hidden");
          $("liveActions").classList.remove("hidden");
          $("note").textContent = "Speak naturally. Ambient will check with its owner before agreeing to a higher price.";
          post("/event", { type: "ready" });
          break;
        }
        case "reply.started": call.replying = true; call.expectReply = false; call.agentText = ""; document.body.dataset.state = "speaking"; break;
        case "reply.audio": play(event.data); break;
        case "transcript.agent":
          caption("Ambient · AI", event.text, "agent");
          call.agentText = event.text;
          if (event.interrupted) post("/event", { type: "interrupted", spokenSoFar: event.text });
          break;
        case "transcript.user": caption("You", event.text ?? event.delta ?? "", "user"); break;
        case "input.speech.started": if (call.replying) flushPlayback(); break;
        case "reply.done":
          call.replying = false;
          document.body.dataset.state = "live";
          if (event.status === "interrupted") flushPlayback();
          else {
            const text = call.agentText, flushes = call.flushes;
            setTimeout(() => { if (call.flushes === flushes) post("/event", { type: "played", text }); }, Math.max(0, (call.playAt - call.ctx.currentTime) * 1000));
          }
          if (call.endAfterReply) setTimeout(() => end("Ambient ended the call"), Math.max(400, (call.playAt - call.ctx.currentTime) * 1000 + 300));
          break;
        case "session.error": caption("Ambient", `Connection problem: ${event.message ?? event.code}`, "agent"); break;
        case "session.ended": end(); break;
      }
    };
    ws.onclose = () => end();
  } catch (error) {
    setState("ended", "Couldn't connect");
    $("note").textContent = error instanceof Error ? error.message : String(error);
    $("answer").disabled = false;
  }
};
</script>
</body>
</html>
